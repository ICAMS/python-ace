site_name: pacemaker
site_url: https://pacemaker.readthedocs.io/en/latest/
repo_url: https://github.com/ICAMS/python-ace

validation:
  links:
    unrecognized_links: warn
    anchors: warn

theme:
  name: "material"

plugins:
  - search

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: "#"
      separator: "_"

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
    - Home: index.md
    - Installation: pacemaker/install.md
    - Building and publishing: pacemaker/releases.md
    - Quick start: pacemaker/quickstart.md
    - Pacemaker workflow: pacemaker/workflow.md
    - Extrapolation grade and active learning: pacemaker/active_learning.md
    - Input file: pacemaker/inputfile.md
    - CLI: pacemaker/cli.md
    - Utilities: pacemaker/utilities.md
    - FAQs: pacemaker/faq.md
