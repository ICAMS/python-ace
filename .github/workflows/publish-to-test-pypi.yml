name: Publish sdist to TestPyPI

# Manual only. An index filename can be uploaded exactly once -- deleting or
# yanking does not free it -- so this must never fire by itself. It used to run
# `on: push`, which would have burned a version number on every commit.
on: workflow_dispatch

jobs:
  build-n-publish:
    name: Build and publish the source distribution to TestPyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # sdist only, deliberately. `build --wheel` on a bare runner emits a
      # linux_x86_64 tag, which PyPI and TestPyPI both reject -- portable wheels
      # have to be built inside a manylinux container, which is what
      # wheels.yml does with cibuildwheel. Publishing wheels from here is not a
      # matter of adding a flag; it cannot work.
      - name: Build the source distribution
        run: pipx run build --sdist

      # Same guard as wheels.yml: CMakeExtension declares sources=[], so the
      # C++ tree only reaches the sdist via MANIFEST.in. An sdist without it
      # uploads happily and then fails for whoever builds from source.
      - name: Verify the sdist can actually build
        run: |
          set -euo pipefail
          tar tzf dist/*.tar.gz > files.txt
          grep -qE 'CMakeLists\.txt$' files.txt || { echo "sdist has no CMakeLists.txt"; exit 1; }
          grep -qE 'lib/pybind11/include/pybind11/pybind11\.h$' files.txt || { echo "sdist has no pybind11"; exit 1; }
          cpp=$(grep -cE '\.cpp$' files.txt)
          echo "sdist carries $cpp .cpp files"
          [ "$cpp" -ge 60 ] || { echo "expected >=60 .cpp files, got $cpp"; exit 1; }

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          # wheels.yml can also publish this same sdist to TestPyPI. Without
          # this, whichever runs second fails on the duplicate filename.
          skip-existing: true
