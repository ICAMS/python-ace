# This workflow tests pyace across Python 3.9-3.13
name: Python package CI

on:
  pull_request:
    branches: [ "master", "alphataubio-python-3-13" ]
  push:
    branches: [ "master", "alphataubio-python-3-13" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build
    
    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake ninja
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest build
        # Install basic dependencies first
        pip install -r requirements.txt
    
    - name: Run compatibility test (pre-install)
      run: |
        python test_compatibility.py
    
    - name: Build package
      run: |
        python -m build
    
    - name: Install package
      run: |
        pip install dist/*.whl
    
    - name: Run compatibility test (post-install)
      run: |
        python test_compatibility.py
    
    - name: Run basic tests
      run: |
        pytest tests/sanity_test.py -v
    
    # Optional: Install tensorpotential if available
    - name: Test with tensorpotential (optional)
      continue-on-error: true
      run: |
        # Try to install tensorpotential
        git clone https://github.com/ICAMS/TensorPotential.git || echo "Could not clone TensorPotential"
        if [ -d "TensorPotential" ]; then
          cd TensorPotential
          if [ -f requirements.txt ]; then pip install -r requirements.txt || echo "TP requirements failed"; fi
          pip install . || echo "TP install failed"
          cd ..
          # Run tensorpotential tests if available
          pytest tests/ --runtensorpot -v || echo "TP tests failed"
        fi

  integration-test:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]  # Test a subset for integration
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install .
    
    - name: Integration test of CLI
      run: |
        cd tests/test-CLI/Cu-I && bash integration_test.sh
        cd ../Ethanol && bash integration_test.sh
